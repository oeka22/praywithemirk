name: Pray with Emir K. – APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Das Android-SDK ist auf dem GitHub-Rechner vorinstalliert – nur Lizenzen bestätigen
      - name: Android-SDK vorbereiten
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Dateien prüfen
        run: |
          ls -la
          ls -la app

      - name: APK bauen
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PrayWithEmirK.apk

      - name: Als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: PrayWithEmirK-apk
          path: PrayWithEmirK.apk

      - name: Release aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pray with Emir K. – neueste Version
          body: "Zum Installieren: PrayWithEmirK.apk antippen, herunterladen und öffnen."
          files: PrayWithEmirK.apk
          make_latest: true
